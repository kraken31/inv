<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crypto</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <header class="topbar">
    <h1>Crypto</h1>
    <nav class="nav">
      <button id="refresh-pricing-all" type="button" class="nav-action"
              title="Lance les cours actions, ETF et crypto">
        ↻ Tous les cours
      </button>
      <span id="refresh-pricing-all-status" class="nav-status"></span>
      <button id="refresh-pricing" type="button" class="nav-action"
              title="Lance get_pricing.py pour rafraîchir les cours des actions">
        ↻ Cours action
      </button>
      <span id="refresh-pricing-status" class="nav-status"></span>
      <button id="refresh-pricing-etf" type="button" class="nav-action"
              title="Lance get_pricing_etf.py pour rafraîchir les cours ETF">
        ↻ Cours ETF
      </button>
      <span id="refresh-pricing-etf-status" class="nav-status"></span>
      <button id="refresh-pricing-crypto" type="button" class="nav-action"
              title="Lance get_pricing_crypto.py pour rafraîchir les cours crypto">
        ↻ Cours crypto
      </button>
      <span id="refresh-pricing-crypto-status" class="nav-status"></span>
      <button id="refresh-dividends" type="button" class="nav-action"
              title="Lance get_dividends.py pour rafraîchir les dividendes">
        ↻ Dividendes
      </button>
      <span id="refresh-dividends-status" class="nav-status"></span>
      <button id="refresh-results" type="button" class="nav-action"
              title="Lance get_results.py pour rafraîchir les résultats">
        ↻ Résultats
      </button>
      <span id="refresh-results-status" class="nav-status"></span>
    </nav>
  </header>

  <div class="layout">
    <aside class="sidebar">
      {% include "_sidebar.html" %}
    </aside>

    <main>
    <section class="toolbar">
      <div class="autocomplete">
        <input type="search" id="crypto-search"
               placeholder="Rechercher une crypto (nom ou ticker)…"
               autocomplete="off" />
        <ul id="crypto-suggestions" class="autocomplete-list" hidden></ul>
      </div>
    </section>

    <div id="status" class="status"></div>

    <section id="crypto-detail" class="action-detail" hidden>
      <header class="action-header">
        <h2 id="crypto-name"></h2>
        <span id="crypto-ticker" class="isin"></span>
      </header>

      <div class="kpi-row">
        <div class="kpi-card">
          <div class="kpi-label">Ticker</div>
          <div class="kpi-value kpi-text" id="crypto-ticker-kpi">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">RSI</div>
          <div class="kpi-value" id="crypto-rsi">—</div>
          <div class="kpi-meta" id="crypto-rsi-date"></div>
        </div>
      </div>
    </section>

    <table id="crypto-table" class="wallet" hidden>
      <thead>
        <tr>
          <th data-key="name" class="sort">Nom</th>
          <th data-key="ticker" class="sort">Ticker</th>
          <th data-key="rsi" class="sort num">RSI</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    </main>
  </div>

  <script src="{{ url_for('static', filename='crypto.js') }}"></script>
  <script src="{{ url_for('static', filename='nav.js') }}"></script>
</body>
</html>
