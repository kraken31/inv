<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ETF</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <header class="topbar">
    <h1>ETF</h1>
    <nav class="nav">
      <button id="refresh-pricing" type="button" class="nav-action"
              title="Lance get_pricing.py pour rafraîchir les cours">
        ↻ Cours
      </button>
      <span id="refresh-pricing-status" class="nav-status"></span>
      <button id="refresh-dividends" type="button" class="nav-action"
              title="Lance get_dividends.py pour rafraîchir les dividendes">
        ↻ Dividendes
      </button>
      <span id="refresh-dividends-status" class="nav-status"></span>
      <button id="refresh-results" type="button" class="nav-action"
              title="Lance get_results.py pour rafraîchir les résultats">
        ↻ Résultats
      </button>
      <span id="refresh-results-status" class="nav-status"></span>
      <button id="refresh-pricing-etf" type="button" class="nav-action"
              title="Lance get_pricing_etf.py pour rafraîchir les cours ETF">
        ↻ Cours ETF
      </button>
      <span id="refresh-pricing-etf-status" class="nav-status"></span>
    </nav>
  </header>

  <div class="layout">
    <aside class="sidebar">
      {% include "_sidebar.html" %}
    </aside>

    <main>
    <section class="toolbar">
      <div class="autocomplete">
        <input type="search" id="etf-search"
               placeholder="Rechercher un ETF (nom ou ticker)…"
               autocomplete="off" />
        <ul id="etf-suggestions" class="autocomplete-list" hidden></ul>
      </div>
      <select id="etf-category-filter" aria-label="Filtrer par catégorie">
        <option value="">Tous</option>
      </select>
    </section>

    <div id="status" class="status"></div>

    <section id="etf-detail" class="action-detail" hidden>
      <header class="action-header">
        <h2 id="etf-name"></h2>
        <span id="etf-id" class="isin"></span>
      </header>

      <div class="kpi-row">
        <div class="kpi-card">
          <div class="kpi-label">Dernier prix</div>
          <div class="kpi-value" id="etf-price">—</div>
          <div class="kpi-meta" id="etf-price-date"></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">TER</div>
          <div class="kpi-value" id="etf-ter">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Catégorie</div>
          <div class="kpi-value kpi-text" id="etf-category">—</div>
        </div>
      </div>
    </section>

    <table id="etf-table" class="wallet" hidden>
      <thead>
        <tr>
          <th data-key="name" class="sort">Nom</th>
          <th data-key="id" class="sort">Ticker</th>
          <th data-key="ter" class="sort num">TER</th>
          <th data-key="price" class="sort num">Prix</th>
          <th data-key="price_date" class="sort">Date</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    </main>
  </div>

  <script src="{{ url_for('static', filename='etf.js') }}"></script>
  <script src="{{ url_for('static', filename='nav.js') }}"></script>
</body>
</html>
