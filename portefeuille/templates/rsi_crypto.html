<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RSI crypto</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <header class="topbar">
    <h1>RSI crypto &lt; 30</h1>
    {% include "_refresh_nav.html" %}
  </header>

  <div class="layout">
    <aside class="sidebar">
      {% include "_sidebar.html" %}
    </aside>

    <main>
    <section class="toolbar">
      <input type="search" id="search" placeholder="Rechercher (nom ou symbole)…" />
      <button id="reload" type="button">Actualiser</button>
      <button id="export-csv" type="button">Exporter CSV</button>
    </section>

    <div id="status" class="status"></div>

    <table id="rsi-crypto-table" class="wallet">
      <thead>
        <tr>
          <th data-key="name" class="sort">Nom</th>
          <th data-key="rsi" class="sort num">RSI</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    </main>
  </div>

  <script src="{{ url_for('static', filename='csv.js') }}"></script>
  <script src="{{ url_for('static', filename='rsi_crypto.js') }}"></script>
  <script src="{{ url_for('static', filename='nav.js') }}"></script>
</body>
</html>
