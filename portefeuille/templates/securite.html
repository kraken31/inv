<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page_title|default('Croissance') }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body data-market="{{ market|default('fr') }}">
  <header class="topbar">
    <h1>{{ page_title|default('Croissance') }}</h1>
    {% include "_refresh_nav.html" %}
  </header>

  <div class="layout">
    <aside class="sidebar">
      {% include "_sidebar.html" %}
    </aside>

    <main>
    <section class="toolbar">
      <input type="search" id="search" placeholder="Rechercher (nom ou {{ id_label|default('ISIN') }})…" />
      <button id="reload" type="button">Actualiser</button>
      <button id="export-csv" type="button">Exporter CSV</button>
    </section>

    <div id="status" class="status"></div>

    <table id="securite-table" class="wallet">
      <thead>
        <tr>
          <th data-key="name" class="sort">Nom</th>
          <th data-key="result_n3" class="sort num">Résultat {{ year_n3 }}</th>
          <th data-key="result_n2" class="sort num">Résultat {{ year_n2 }}</th>
          <th data-key="result_n1" class="sort num">Résultat {{ year_n1 }}</th>
          <th data-key="result_n"  class="sort num">Résultat {{ year_n }}</th>
          <th data-key="per" class="sort num">PER</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    </main>
  </div>

  <script src="{{ url_for('static', filename='csv.js') }}"></script>
  <script src="{{ url_for('static', filename='securite.js') }}"></script>
  <script src="{{ url_for('static', filename='nav.js') }}"></script>
</body>
</html>
