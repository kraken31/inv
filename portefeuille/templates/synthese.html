<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Synthèse</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <header class="topbar">
    <h1>Synthèse</h1>
    {% include "_refresh_nav.html" %}
  </header>

  <div class="layout">
    <aside class="sidebar">
      {% include "_sidebar.html" %}
    </aside>

    <main>
      <p class="summary">

      <div id="status" class="status"></div>
      <div id="synthese" class="synthese-grid"></div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='synthese.js') }}"></script>
